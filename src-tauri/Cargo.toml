[package]
name = "openlongevity"
version = "0.0.1"
description = "Local-first scientific longevity knowledge and AI desktop app"
authors = ["Open Longevity"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openlongevity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
chrono = "0.4"
