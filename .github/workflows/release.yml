name: Release desktop apps

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Release checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $EXPECTED"
            exit 1
          fi

      - name: Build frontend
        run: npm run build

      - name: Check bilingual starter library
        run: npm run library:check

      - name: Check release version
        run: npm run release:check

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  create-release:
    name: Create release
    needs: quality
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse release draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ID=$(gh api --paginate "repos/${REPO}/releases" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty")

          if [ -z "$ID" ]; then
            ID=$(gh api --method POST "repos/${REPO}/releases" \
              -f tag_name="${TAG}" \
              -f name="Open Longevity ${TAG}" \
              -f body="Open Longevity 0.0.8

          What is new since 0.0.7:
          - OpenAI and Anthropic now keep independent API URLs, models, and API keys, with automatic migration of existing settings
          - New provider fields stay empty and show protocol-specific examples as placeholders instead of writing defaults
          - The chat composer now uses one action button: an up arrow for send that becomes a stop control during generation
          - The update action is now a background-free download icon with one consistently aligned progress ring
          - Fixed the Windows update launch order so the installer opens before Open Longevity exits

          Open Longevity takes Bryan Johnson’s longevity plan as a starting blueprint, then adds AI and scientific evidence in a local-first desktop workspace, with Windows, macOS, and Linux builds.

          These binaries are not code-signed. Your operating system may display an unverified-developer warning." \
              -F draft=true \
              -F prerelease=false \
              --jq ".id")
          fi

          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: "--bundles nsis,msi"

          - name: macOS Apple Silicon
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"

          - name: macOS Intel
            platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"

          - name: Linux x64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: "--bundles deb,rpm,appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  rename-assets:
    name: Normalize download names
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          gh api "repos/${REPO}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r ID NAME; do
              case "$NAME" in
                *_x64-setup.exe)            NEW="Open.Longevity_${VERSION}_Windows_x64-setup.exe" ;;
                *_x64_*.msi|*_x64.msi)      NEW="Open.Longevity_${VERSION}_Windows_x64.msi" ;;
                *_aarch64.dmg)              NEW="Open.Longevity_${VERSION}_macOS_arm64.dmg" ;;
                *_x64.dmg)                  NEW="Open.Longevity_${VERSION}_macOS_x64.dmg" ;;
                *_amd64.deb)                NEW="Open.Longevity_${VERSION}_Linux_x64.deb" ;;
                *.x86_64.rpm)               NEW="Open.Longevity_${VERSION}_Linux_x64.rpm" ;;
                *_amd64.AppImage|*_x86_64.AppImage)
                                              NEW="Open.Longevity_${VERSION}_Linux_x64.AppImage" ;;
                *)                          NEW="" ;;
              esac

              if [ -n "$NEW" ] && [ "$NEW" != "$NAME" ]; then
                gh api --method PATCH "repos/${REPO}/releases/assets/${ID}" \
                  -f name="$NEW" \
                  --jq ".name"
              fi
            done

  publish-release:
    name: Publish release
    needs: [create-release, rename-assets]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true
